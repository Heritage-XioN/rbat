[package]
name = "rbat"
version = "1.0.1"
edition = "2024"
authors = ["Heritage-XioN"]
description = "A terminal-native binary analysis tool for security researchers and reverse engineers."
license = "Apache-2.0"
repository = "https://github.com/Heritage-XioN/rbat"
readme = "README.md"
keywords = ["binary-analysis", "security", "reverse-engineering", "tui", "disassembly"]
categories = ["command-line-utilities", "parsing", "security"]

[features]
default = ["backend-capstone"]
backend-iced = ["dep:iced-x86"]
backend-capstone = ["dep:capstone"]

[dependencies]
capstone = { version = "0.14.0", optional = true }
iced-x86 = { version = "1.21.0", features = ["code_asm"], optional = true }
clap = { version =  "4.6.1", features = ["derive", "usage"]}
clap_complete = "4.5"
object = "0.39.1"
petgraph = "0.8.3"
color-eyre = { workspace = true }
crossterm = "0.29.0"
ratatui = "0.30.0"
rust-embed = { version = "8.11.0", features = ["compression", "include-exclude"] }
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = { workspace = true }
thiserror = { workspace = true }
yara = { version = "0.32.0", features = ["vendored"] }
csv = "1.4.0"
chrono = { workspace = true }
askama = "0.16.0"
fullbleed = "0.6.11"
smallvec = { version = "1.13.0", features = ["serde"] }
lightningcss = "=1.0.0-alpha.70"
rayon = { workspace = true }
indicatif = { workspace = true }
tui-banner = { workspace = true }
fast-flirt = "0.1.1"
msvc-demangler = "0.9.0"
cpp_demangle = "0.4.3"
aho-corasick = "1.1.4"
rustc-hash = "2.1.3"
ahash = { version = "0.8.12", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.2.2"
object = { version = "0.39.1", features = ["write"] }
predicates = "3.1.4"
tempfile = "3.10"
