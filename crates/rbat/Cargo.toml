[package]
name = "rbat"
version = "0.3.0"
edition = "2024"
authors = ["Heritage-XioN"]
description = "A high-performance static binary analysis engine for ELF, PE, and Mach-O files."
license = "Apache-2.0"
repository = "https://github.com/Heritage-XioN/rbat"
readme = "README.md"
keywords = ["binary-analysis", "security", "reverse-engineering", "disassembly"]
categories = ["parsing", "security"]

[features]
default = ["backend-capstone", "backend-iced"]
backend-iced = ["dep:iced-x86"]
backend-capstone = ["dep:capstone"]

[dependencies]
capstone = { version = "0.14.0", optional = true }
iced-x86 = { version = "1.21.0", features = ["code_asm"], optional = true }
object = "0.39.1"
petgraph = "0.8.3"
rust-embed = { version = "8.11.0", features = ["compression", "include-exclude"] }
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
yara = { version = "0.32.0", features = ["vendored"] }
chrono = { workspace = true }
smallvec = { version = "1.13.0", features = ["serde"] }
compact_str = { version = "0.9.0", features = ["serde"] }
rayon = { workspace = true }
fast-flirt = "0.2.2"
msvc-demangler = "0.9.0"
cpp_demangle = "0.4.3"
aho-corasick = "1.1.4"
regex = "1.12"
rustc-hash = "2.1.3"
ahash = { version = "0.8.12", features = ["serde"] }
toml = "0.9.5"
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.9"
fuzzyhash = "0.2.2"
fast-tlsh = { version = "0.1.10", default-features = false, features = ["std", "easy-functions", "opt-default"] }

[dev-dependencies]
object = { version = "0.39.1", features = ["write"] }
tempfile = "3.10"
proptest = "1.6"
