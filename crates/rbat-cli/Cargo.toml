[package]
name = "rbat-cli"
version = "0.1.0"
edition = "2024"
authors = ["Heritage-XioN"]
description = "A terminal-native binary analysis tool and interactive dashboard for security researchers and reverse engineers."
license = "Apache-2.0"
repository = "https://github.com/Heritage-XioN/rbat"
readme = "README.md"
keywords = ["binary-analysis", "security", "reverse-engineering", "tui", "disassembly"]
categories = ["command-line-utilities", "security"]

[[bin]]
name = "rbat"
path = "src/main.rs"

[features]
default = ["backend-capstone", "backend-iced", "report-json"]
backend-capstone = ["rbat/backend-capstone"]
backend-iced = ["rbat/backend-iced"]
dhat-heap = ["dep:dhat"]

# Report generation features
report-csv = ["dep:csv"]
report-json = ["dep:serde_json"]
report-pdf = ["dep:fullbleed", "dep:askama", "dep:lightningcss"]
reports = ["report-csv", "report-json", "report-pdf"]

[dependencies]
dhat = { version = "0.3.3", optional = true }
rbat = { path = "../rbat", default-features = false }
clap = { workspace = true }
clap_complete = "4.5"
color-eyre = { workspace = true }
indicatif = { workspace = true }
tui-banner = { workspace = true }
crossterm = "0.29.0"
ratatui = "0.30.0"
comfy-table = "7.1.4"
askama = { version = "0.16.0", optional = true }
fullbleed = { version = "0.6.11", optional = true }
lightningcss = { version = "=1.0.0-alpha.70", optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
chrono = { workspace = true }
csv = { version = "1.4.0", optional = true }
ahash = "0.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.10"
