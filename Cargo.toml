[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
rayon = "1.12.0"
tui-banner = "0.2.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0.149"
yaml_serde = "0.10"
thiserror = "2.0.18"
indicatif = "0.18.4"
chrono = "0.4.44"
color-eyre = "0.6.3"
rmp-serde = "1.3"
walkdir = "2.5.0"
clap = { version =  "4.6.1", features = ["derive", "usage"]}

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
