name: Rust CI

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'crates/**'
      - 'fuzz/**'
      - 'scripts/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-rust.yml'
  push:
    branches: [ master ]
    paths:
      - 'crates/**'
      - 'fuzz/**'
      - 'scripts/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-rust.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-rust:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcapstone-dev libyara-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Check Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (All Targets & All Features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check Fuzz Manifest
        run: cargo check --manifest-path fuzz/Cargo.toml

  test-rust:
    name: Run Tests & Feature Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcapstone-dev libyara-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Workspace Tests (Default Features)
        run: cargo test --workspace --all-targets --verbose
      - name: Test rbat (backend-iced only)
        run: cargo test -p rbat --no-default-features --features backend-iced
      - name: Test rbat (backend-capstone only)
        run: cargo test -p rbat --no-default-features --features backend-capstone
      - name: Test rbat-cli (backend-iced only)
        run: cargo test -p rbat-cli --no-default-features --features backend-iced
      - name: Test rbat-cli (backend-capstone only)
        run: cargo test -p rbat-cli --no-default-features --features backend-capstone
